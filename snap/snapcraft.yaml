# ASCII Racing as a snap, built from source: installs desktop/, runs
# `npm run dist:dir` and packs release/linux-unpacked. The Snap Store's
# Builds tab builds and releases it to edge on every push to main; .github/workflows/snap.yml
# builds the same file and smoke-tests it.
#
# The store banner is not part of the snap. snap/gui is only the desktop entry and the icon,
# which snapcraft copies to meta/gui. Upload snap/store/banner.jpg in the listing media and
# keep the name banner.jpg: 3840×1280, 3:1, under the 2 MB limit.
name: ascii-racing
title: ASCII Racing
base: core22
adopt-info: ascii-racing
icon: snap/gui/icon.png
summary: Isometric combat racing, drawn entirely in ASCII
description: |
  A combat racer in the spirit of Rock'n Roll Racing. Race three rivals
  over three laps, grab power-ups and blow them off the track. Homing
  missiles, mines, nitro and repair pickups. Wrecked cars respawn, and
  the rivals fight back.

  Everything on screen is ASCII: the cars are small 3D models turned into
  characters, and the track draws its own kerbs, walls and start line.
  The art is generated by code and the sound is synthesized, so the game
  runs offline. English, Portuguese, Spanish, French and German.
license: AGPL-3.0-or-later
website: https://gamestudio42.github.io/ascii-racing/
source-code: https://github.com/gamestudio42/ascii-racing
issues: https://github.com/gamestudio42/ascii-racing/issues
contact: talkgamestudio42@gmail.com
grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: amd64

apps:
  ascii-racing:
    # Chromium's own sandbox cannot run inside strict confinement; the snap sandbox replaces it.
    command: app/ascii-racing --no-sandbox
    desktop: meta/gui/ascii-racing.desktop
    extensions: [gnome]
    plugs:
      - browser-support
      - opengl
      - audio-playback
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  ascii-racing:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' desktop/package.json)"
    override-build: |
      set -eu
      # nil does not always copy the source into the build directory.
      if [ ! -f desktop/package.json ]; then
        cp -a "$CRAFT_PART_SRC/." "$CRAFT_PART_BUILD/"
      fi
      export ELECTRON_CACHE="$CRAFT_PART_BUILD/.cache/electron"
      export ELECTRON_BUILDER_CACHE="$CRAFT_PART_BUILD/.cache/electron-builder"
      npm ci --prefix desktop --cache "$CRAFT_PART_BUILD/.npm-cache"
      npm --prefix desktop run dist:dir
      mkdir -p "$CRAFT_PART_INSTALL/app"
      cp -a desktop/release/linux-unpacked/. "$CRAFT_PART_INSTALL/app/"
